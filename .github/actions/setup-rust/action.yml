name: Setup Rust
description: Install Rust toolchain and cache dependencies.

inputs:
  toolchain:
    description: Rust toolchain channel to install.
    required: false
    default: stable
  components:
    description: Optional rustup components (comma-separated).
    required: false
    default: ""
  cache:
    description: Enable Cargo cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install libdbus (d7s Linux keyring)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Cache Cargo dependencies
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        # PR caches are branch-scoped and evicted each other past the 10 GB limit; only main saves.
        save-if: ${{ github.ref == 'refs/heads/main' }}
