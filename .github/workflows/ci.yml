name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly-2026-09-08
          components: rustfmt
          cache: "false"
      - name: check formatting
        run: cargo fmt -- --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: Run clippy action
        uses: clechasseur/rs-clippy-check@ac75e246ebbd78d106ac9460c668ab7c8044ebe3 # v6.1.1
        with:
          args: --workspace --all-features --all-targets -- -D warnings -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -A clippy::multiple_crate_versions
  doc:
    # Nightly for docsrs cfg. Skipped on PRs (no push trigger today).
    name: doc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
      - name: Run cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.95"
      - name: cargo check (MSRV)
        run: cargo check --workspace --locked
  test:
    runs-on: ${{ matrix.os }}
    name: test ${{ matrix.os }} (${{ matrix.profile }})
    timeout-minutes: 35
    strategy:
      fail-fast: ${{ vars.CI_FAIL_FAST == 'true' }}
      matrix:
        include:
          - os: ubuntu-latest
            profile: full
            test_command: cargo nextest run --locked --all-features --all-targets
          - os: macos-latest
            profile: smoke
            test_command: cargo nextest run --locked --workspace
          - os: windows-latest
            profile: smoke
            test_command: cargo nextest run --locked --workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Install cargo-nextest
        uses: taiki-e/install-action@23d41aa71228a2692ee31bb433f070fd4bdc6661 # nextest
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: Run test suite
        run: ${{ matrix.test_command }}
