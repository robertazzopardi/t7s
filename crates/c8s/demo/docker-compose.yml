services:
  demo-web:
    image: nginx:alpine
    container_name: demo-web
    ports:
      - "18080:80"

  demo-cache:
    image: redis:alpine
    container_name: demo-cache
    # redis declares VOLUME /data; name it so restarts don't leave anonymous volumes.
    volumes:
      - demo_cache_data:/data

volumes:
  demo_cache_data:
