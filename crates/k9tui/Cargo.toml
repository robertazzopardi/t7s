[package]
name = "k9tui"
version = "0.1.0"
description = "Reusable k9s-style ratatui widget kit"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "LICENSE", "README.md"]
keywords = ["tui", "ratatui", "widgets", "terminal", "k9s"]
categories = ["command-line-interface", "gui"]
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
ratatui = { version = "0.30.2", features = ["crossterm"], default-features = false }
ratatui-textarea = "0.9.3"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync"] }
unicode-width = { version = "0.2", default-features = false }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
