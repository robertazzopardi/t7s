[package]
name = "p7s"
version = "0.1.0"
description = "A k9s-style TUI for watching system processes"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
include = ["src/**/*", "Cargo.toml", "LICENSE", "README.md", "CHANGELOG.md"]
keywords = [
    "process",
    "monitor",
    "tui",
    "terminal",
    "k9s",
]
categories = [
    "command-line-utilities",
    "development-tools",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/p7s-v{ version }/p7s-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "p7s-v{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/p7s-v{ version }/p7s-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
# Internal
k9tui = { path = "../k9tui", version = "0.1.0" }

# UI
crossterm = { version = "0.29.0", default-features = false, features = ["osc52", "bracketed-paste", "events", "windows"] }
ratatui = { version = "0.30.0", features = ["crossterm"], default-features = false }

# Async
tokio = { version = "1.47.0", features = ["full"] }

# System information (processes, CPU, memory).
# 0.38.x is the newest line whose MSRV (1.88) is within the workspace's 1.89;
# 0.39 requires rustc 1.95.
sysinfo = { version = "0.38", default-features = false, features = ["system", "user"] }

[lints]
workspace = true
