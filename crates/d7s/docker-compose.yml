services:
  postgres:
    image: postgres:18-alpine
    container_name: d7s-test-db
    environment:
      POSTGRES_DB: d7s_test
      POSTGRES_USER: d7s_user
      POSTGRES_PASSWORD: d7s_password
      POSTGRES_MULTIPLE_DATABASES: test_db_1,test_db_2
    ports:
      - "5432:5432"
    volumes:
      # Uncomment the line below for persistent data storage
      # - postgres_data:/var/lib/postgresql/data
      - ./docker/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/02-init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d7s_user -d d7s_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - d7s-network

  # MySQL 8 on 13306 (not 3306, which a local MySQL usually owns), MariaDB on 3307
  # (root / d7s_password, database d7s_test).
  mysql:
    image: mysql:8
    container_name: d7s-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: d7s_password
      MYSQL_DATABASE: d7s_test
    ports:
      - "13306:3306"
    volumes:
      - ./docker/seed-mysql.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    networks:
      - d7s-network

  mariadb:
    image: mariadb:11
    container_name: d7s-test-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: d7s_password
      MARIADB_DATABASE: d7s_test
    ports:
      - "3307:3306"
    volumes:
      - ./docker/seed-mysql.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    networks:
      - d7s-network

  # SQLite has no server: this container just builds a seeded .sqlite file
  # into ./docker/sqlite/d7s_test.sqlite, then exits. Point the app at that
  # file path directly to test the sqlite backend.
  sqlite:
    image: keinos/sqlite3:latest
    container_name: d7s-test-sqlite
    volumes:
      - ./docker/sqlite:/data
      - ./docker/seed-sqlite.sql:/seed.sql:ro
    entrypoint: ["sh", "-c", "rm -f /data/d7s_test.sqlite && sqlite3 /data/d7s_test.sqlite < /seed.sql && echo 'sqlite test db ready at ./docker/sqlite/d7s_test.sqlite'"]
    restart: "no"

# Uncomment for persistent data storage
# volumes:
#   postgres_data:

networks:
  d7s-network:
    driver: bridge
