# Built-in d7s definitions, merged over k9tui's config.toml.
[d7s.keys]
new-connection = "n"
edit-connection = "e"
delete-connection = "D"
open-connection = "o"
reconnect = "O"
ping = "p"
describe = "d"
sql-editor = "e"
table-structure = "t"
run-sql = "E"
copy = "y"
copy-row = "Y"
help = "?"
watch = "w"
width = "W"
query-log = "L"
activity = "A"
export = "x"
refresh = ["r", "R"]
new-row = ["n", "a"]
defaults = "N"
edit = "i"
duplicate = "c"
commit = "s"
delete-row = "D"
drill = "enter"
jump-row = "#"
toggle-select = "space"
recent-1 = "1"
recent-2 = "2"
recent-3 = "3"
recent-4 = "4"
recent-5 = "5"
cell-cancel = "esc"
cell-done = "enter"
cell-next = "tab"
cell-previous = "back-tab"

[d7s.screens.connections]
hotkeys = [
  { action = "new-connection", label = "New Connection" },
  { action = "edit-connection", label = "Edit Connection" },
  { action = "delete-connection", label = "Delete Connection" },
  { action = "open-connection", label = "Open Connection" },
  { action = "ping", label = "Ping Health" },
  { action = "describe", label = "Describe" },
  { action = "search", label = "Search" },
  { action = "command", label = "Command" },
]
hidden = [
  "reconnect", "copy", "copy-row", "width", "help", "quit", "back", "drill",
  "down", "up", "left", "right", "top", "bottom", "first-column", "last-column",
]

[d7s.screens.global-connections]
hotkeys = [
  { action = "help", label = "Help" },
  { action = "quit", label = "Quit" },
]

[d7s.screens.global-explorer]
hotkeys = [
  { action = "help", label = "Help" },
  { action = "back", label = "Back" },
]

[d7s.screens.database]
hotkeys = [
  { action = "sql-editor", label = "SQL Editor" },
  { action = "table-structure", label = "Table structure" },
  { action = "describe", label = "Describe" },
  { action = "run-sql", label = "Run SQL" },
  { action = "search", label = "Search" },
  { action = "command", label = "Command" },
  { action = "copy", label = "Copy value" },
  { action = "activity", label = "Activity (Postgres)" },
  { action = "query-log", label = "Query log" },
]
hidden = [
  "copy-row", "width", "help", "quit", "back", "drill",
  "recent-1", "recent-2", "recent-3", "recent-4", "recent-5",
  "down", "up", "left", "right", "top", "bottom", "first-column", "last-column",
]

[d7s.screens.table-data]
hotkeys = [
  { action = "new-row", label = "New row" },
  { action = "defaults", label = "Defaults" },
  { action = "duplicate", label = "Duplicate" },
  { action = "commit", label = "Commit" },
  { action = "delete-row", label = "Delete" },
  { action = "edit", label = "Edit" },
]
hidden = [
  "sql-editor", "table-structure", "describe", "search", "command", "copy",
  "activity", "query-log", "copy-row", "width", "help", "quit", "back", "drill",
  "refresh", "jump-row", "toggle-select",
  "recent-1", "recent-2", "recent-3", "recent-4", "recent-5",
  "down", "up", "left", "right", "top", "bottom", "first-column", "last-column",
]

[d7s.screens.cell-edit]
typing = true
hotkeys = [
  { action = "cell-cancel", label = "Cancel" },
  { action = "cell-done", label = "Done" },
  { action = "cell-next", label = "Next col" },
  { action = "cell-previous", label = "Prev col" },
  { key = "Ctrl+e", label = "Modal" },
  { key = "Backspace", label = "Delete char" },
]

[d7s.screens.sql-results]
hidden = [
  "sql-editor", "table-structure", "describe", "run-sql", "search", "command",
  "copy", "activity", "query-log", "copy-row", "watch", "export", "width",
  "help", "quit", "back", "drill",
  "recent-1", "recent-2", "recent-3", "recent-4", "recent-5",
  "down", "up", "left", "right", "top", "bottom", "first-column", "last-column",
]

[d7s.screens.help]
hidden = ["help", "quit", "back", "down", "up", "top", "bottom"]

[d7s.screens.describe]
hidden = ["describe", "search", "quit", "back", "down", "up", "top", "bottom"]

[d7s.screens.query-log]
hidden = ["query-log", "quit", "back", "down", "up", "top", "bottom"]

[d7s.help.global]
title = "Global"
rows = [
  { action = "help", label = "Toggle help" },
  { action = "quit", label = "Quit" },
  { key = "Ctrl+c", label = "Quit" },
  { action = "copy", label = "Copy cell value" },
  { action = "describe", label = "Describe selected object" },
  { action = "back", label = "Back / clear filter / close help" },
]

[d7s.help.navigation]
title = "Navigation"
rows = [
  { action = "down", label = "Move down" },
  { action = "up", label = "Move up" },
  { action = "left", label = "Move left (columns)" },
  { action = "right", label = "Move right (columns)" },
  { action = "top", label = "Jump to top" },
  { action = "bottom", label = "Jump to bottom" },
  { action = "first-column", label = "First column" },
  { action = "last-column", label = "Last column" },
  { action = "search", label = "Search filter" },
  { action = "width", label = "Toggle column width (Fit / Content)" },
]

[d7s.help.connections]
title = "Connections"
rows = [
  { action = "new-connection", label = "New connection" },
  { action = "edit-connection", label = "Edit connection" },
  { action = "delete-connection", label = "Delete connection" },
  { action = "open-connection", label = "Open connection" },
  { action = "reconnect", label = "Reconnect last connection" },
  { action = "ping", label = "Ping all connections (reachability)" },
  { action = "drill", label = "Connect" },
  { action = "command", label = "Command bar (:q, :help, :log; Tab completes)" },
]

[d7s.help.database]
title = "Database"
rows = [
  { action = "sql-editor", label = "SQL editor (external)" },
  { action = "table-structure", label = "Table structure" },
  { action = "describe", label = "Describe selected table/column/row" },
  { action = "run-sql", label = "Run SQL" },
  { action = "drill", label = "Drill into selection" },
  { action = ["recent-1", "recent-2", "recent-3", "recent-4", "recent-5"], label = "Open recent table" },
  { action = "command", label = "Command bar (:tables, :sql, :log, :table/:schema <name>, :table conn.db.schema.table, :123 ... Tab completes)" },
  { action = "query-log", label = "Query log (everything d7s ran this session)" },
]

[d7s.help.table-data]
title = "Table data"
rows = [
  { action = "new-row", label = "New row (blank draft)" },
  { action = "defaults", label = "New row (column defaults)" },
  { action = "duplicate", label = "Duplicate row as draft" },
  { action = "commit", label = "Commit draft row" },
  { action = "delete-row", label = "Delete row(s)" },
  { action = "edit", label = "Edit selected cell" },
  { action = "refresh", label = "Refresh" },
]

[d7s.help.cell-edit]
title = "Cell edit"
rows = [
  { action = "cell-cancel", label = "Cancel edit (revert cell)" },
  { action = "cell-done", label = "Commit cell" },
  { action = ["cell-next", "cell-previous"], label = "Next / previous editable column" },
  { key = "Ctrl+e", label = "Multiline editor (modal)" },
  { key = "Backspace", label = "Delete character in buffer" },
]

[d7s.help.table-data-hidden]
title = "Not in top bar"
rows = [
  { action = "toggle-select", label = "Toggle multi-select" },
  { action = "drill", label = "Edit cell" },
  { action = "copy-row", label = "Copy row (TSV)" },
  { action = ["command", "jump-row"], label = "Jump to row number" },
  { action = ["top", "bottom"], label = "Jump to top / bottom" },
  { action = ["first-column", "last-column"], label = "First / last column" },
]

[d7s.help.sql-results]
title = "SQL results"
rows = [
  { action = "run-sql", label = "Run SQL from editor" },
  { action = "back", label = "Return to SQL editor" },
  { action = "copy-row", label = "Copy row (TSV)" },
  { key = "Ctrl+s", action = "export", label = "Export results to temp TSV" },
]

[d7s.help.sql-results-hidden]
title = "Not in top bar"
rows = [
  { action = "copy-row", label = "Copy row (TSV)" },
  { key = "Ctrl+s", action = "export", label = "Export results to temp TSV" },
  { action = "back", label = "Return to explorer" },
]

[d7s.help.filter]
title = "Filter"
rows = [
  { key = "", label = "Filter matches loaded page only (client-side)" },
]
