[package]
name = "d7s"
version = "0.5.0"
description = "A k9s-style TUI database client for PostgreSQL, MySQL/MariaDB, and SQLite"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = [
    "database",
    "tui",
    "postgresql",
    "sqlite",
    "mysql",
]
categories = [
    "command-line-utilities",
    "development-tools",
    "database-implementations",
]
include = [
    "src/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[package.metadata.bundle]
identifier = "com.robertazzopardi.d7s"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/d7s-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "d7s-v{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/d7s-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
# Internal
k9tui = { path = "../k9tui", version = "0.1.0" }

# UI
crossterm = { version = "0.29.0", default-features = false, features = ["osc52", "bracketed-paste", "events", "windows"] }
ratatui = { version = "0.30.2", features = ["crossterm"], default-features = false }
tui-menu = "0.3.1"
unicode-width = { version = "0.2", default-features = false }

# Async
tokio = { version = "1.54.1", features = ["full"] }
async-trait = "0.1"

# Database
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6"
tokio-postgres = { version = "0.7.18", features = [
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-uuid-1",
    "array-impls",
] }
postgres-types = { version = "0.2", features = ["derive", "with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }

# Keyring
keyring = "4.2.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

# Types
url = "2.5"
uuid = { version = "1.29.0", default-features = false }
chrono = { version = "0.4.45", default-features = false }
rust_decimal = { version = "1.43.0", default-features = false, features = ["db-tokio-postgres"] }

# Utilities
directories = "6.0.0"
ratatui-textarea = "0.9.3"
sqlparser = "0.63.0"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal", "rustls-tls"] }
tokio-postgres-rustls = "0.14.0"
rustls = "0.23.46"
rustls-native-certs = "0.8.5"

[lints]
workspace = true
